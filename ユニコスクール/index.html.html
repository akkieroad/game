<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>あなたの集客は、どこで止まっている？ | 診断ゲームブック</title>
  <style>
    :root {
      --bg-1: #fff7fb;
      --bg-2: #fff1f6;
      --bg-3: #effcf8;
      --white: rgba(255, 255, 255, 0.88);
      --white-strong: rgba(255, 255, 255, 0.94);
      --text-main: #54484d;
      --text-sub: #7a6b72;
      --rose-100: #fbe4ee;
      --rose-200: #f8cfe0;
      --rose-300: #efabc8;
      --pink-300: #eea9d0;
      --emerald-100: #d8f3ea;
      --emerald-200: #b7ead9;
      --emerald-400: #54c7a5;
      --emerald-500: #2eaa89;
      --shadow-soft: 0 18px 50px rgba(128, 191, 179, 0.16);
      --shadow-card: 0 12px 32px rgba(128, 191, 179, 0.12);
      --radius-xl: 32px;
      --radius-lg: 24px;
      --radius-md: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      color: var(--text-main);
      background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 48%, var(--bg-3) 100%);
      min-height: 100vh;
      line-height: 1.8;
    }

    .page {
      width: min(100%, 1120px);
      margin: 0 auto;
      padding: 24px 16px 56px;
    }

    .topbar,
    .hero,
    .card,
    .result-shell,
    .cta-wrap,
    .stat-card,
    .choice-button,
    .line-cta {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border-radius: var(--radius-xl);
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: var(--shadow-soft);
      margin-bottom: 24px;
    }

    .brand-label {
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--emerald-500);
      margin: 0 0 4px;
    }

    .brand-title {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button,
    a {
      font: inherit;
    }

    .btn {
      border: none;
      cursor: pointer;
      transition: 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-secondary {
      background: #ffffff;
      color: var(--text-main);
      border: 1px solid var(--rose-100);
      border-radius: 999px;
      padding: 11px 18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #fff7fb;
      transform: translateY(-1px);
    }

    .btn-secondary:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .btn-primary {
      color: #fff;
      border-radius: 999px;
      padding: 11px 18px;
      background: linear-gradient(90deg, var(--rose-300), var(--pink-300), var(--emerald-400));
      box-shadow: 0 10px 24px rgba(128, 191, 179, 0.28);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      opacity: 0.96;
    }

    .hero {
      padding: 30px 28px;
      border-radius: var(--radius-xl);
      background: var(--white);
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: var(--shadow-soft);
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.28em;
      color: var(--emerald-500);
    }

    .hero h1,
    .result-head h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 52px);
      line-height: 1.25;
      color: #4d4347;
    }

    .subtitle,
    .lead {
      margin: 14px 0 0;
      font-size: clamp(16px, 2.2vw, 19px);
      color: var(--text-sub);
      max-width: 820px;
    }

    .card {
      padding: 28px;
      border-radius: var(--radius-xl);
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: var(--shadow-soft);
      margin-bottom: 22px;
    }

    .card p,
    .result-bridge p,
    .cta-text,
    .line-copy,
    .note {
      margin: 0 0 14px;
      font-size: 17px;
      color: var(--text-sub);
      line-height: 1.95;
    }

    .card p:last-child,
    .result-bridge p:last-child,
    .cta-text:last-child,
    .line-copy:last-child,
    .note:last-child {
      margin-bottom: 0;
    }

    .choices {
      display: grid;
      gap: 16px;
    }

    .choice-button {
      width: 100%;
      padding: 20px 22px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid var(--emerald-100);
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      text-align: left;
      color: var(--text-main);
    }

    .choice-button:hover {
      transform: translateY(-2px);
      border-color: var(--emerald-200);
      box-shadow: 0 16px 38px rgba(128, 191, 179, 0.18);
    }

    .choice-label {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.7;
    }

    .choice-tag {
      white-space: nowrap;
      padding: 7px 12px;
      border-radius: 999px;
      background: #ecfbf5;
      color: var(--emerald-500);
      font-size: 13px;
      font-weight: 700;
    }

    .result-shell {
      padding: 1px;
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, var(--rose-200), #f5d7eb, var(--emerald-200));
      box-shadow: 0 18px 50px rgba(128, 191, 179, 0.2);
      margin-bottom: 22px;
    }

    .result-head {
      border-radius: calc(var(--radius-xl) - 1px);
      padding: 30px 28px;
      background: linear-gradient(90deg, rgba(255,255,255,0.94), rgba(255,243,248,0.92), rgba(238,252,247,0.92));
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 22px;
    }

    .stat-card {
      padding: 26px;
      border-radius: var(--radius-xl);
      background: rgba(255,255,255,0.86);
      box-shadow: var(--shadow-card);
    }

    .stat-card.rose {
      border: 1px solid var(--rose-100);
      box-shadow: 0 12px 38px rgba(234, 169, 196, 0.12);
    }

    .stat-card.emerald {
      border: 1px solid var(--emerald-100);
      box-shadow: 0 12px 38px rgba(128, 191, 179, 0.14);
    }

    .stat-card h2,
    .cta-inner h2 {
      margin: 0 0 16px;
      font-size: 24px;
      color: #4d4347;
    }

    .point-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 12px;
    }

    .point-list li {
      display: flex;
      gap: 12px;
      color: var(--text-sub);
      line-height: 1.85;
      font-size: 16px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      margin-top: 11px;
      flex: 0 0 auto;
    }

    .dot.rose {
      background: var(--rose-300);
    }

    .dot.emerald {
      background: var(--emerald-400);
    }

    .cta-wrap {
      padding: 1px;
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, var(--rose-200), #f7d8ea, var(--emerald-200));
      box-shadow: 0 18px 50px rgba(128, 191, 179, 0.2);
    }

    .cta-inner {
      border-radius: calc(var(--radius-xl) - 1px);
      background: var(--white-strong);
      padding: 28px;
    }

    .suggestion-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 24px;
    }

    .suggestion {
      border-radius: 22px;
      padding: 16px;
      background: linear-gradient(135deg, #fff6fa, #effcf8);
      border: 1px solid var(--emerald-100);
      color: var(--text-sub);
      font-size: 14px;
      line-height: 1.8;
    }

    .line-cta {
      margin-top: 26px;
      padding: 20px;
      border-radius: 28px;
      border: 1px solid var(--emerald-100);
      background: linear-gradient(90deg, #effcf8 0%, rgba(255,255,255,0.95) 50%, #fff5fa 100%);
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .line-label {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--emerald-500);
    }

    .line-copy {
      margin-bottom: 8px;
      font-size: 17px;
      font-weight: 700;
      color: #5a4c51;
    }

    .note {
      font-size: 14px;
      color: #8b7d83;
    }

    .line-button {
      border-radius: 999px;
      padding: 14px 24px;
      color: #fff;
      background: linear-gradient(90deg, #4ac59f, #2eaa89);
      box-shadow: 0 12px 28px rgba(52, 181, 150, 0.35);
      font-weight: 700;
      white-space: nowrap;
    }

    .line-button:hover {
      transform: translateY(-2px);
      opacity: 0.96;
    }

    .footer-note {
      margin-top: 18px;
      text-align: center;
      color: #8b7d83;
      font-size: 13px;
    }

    @media (max-width: 860px) {
      .result-grid,
      .suggestion-grid {
        grid-template-columns: 1fr;
      }

      .line-cta,
      .topbar {
        flex-direction: column;
        align-items: stretch;
      }

      .actions {
        width: 100%;
      }

      .actions .btn {
        flex: 1;
      }
    }

    @media (max-width: 640px) {
      .page {
        padding: 16px 12px 40px;
      }

      .topbar,
      .hero,
      .card,
      .result-head,
      .cta-inner,
      .stat-card {
        padding: 22px 18px;
      }

      .choice-button {
        padding: 18px;
        border-radius: 24px;
      }

      .choice-label,
      .card p,
      .result-bridge p,
      .cta-text,
      .line-copy {
        font-size: 16px;
      }

      .choice-button {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div>
        <p class="brand-label">AKIKO BRAND / AI × SNS × LINE</p>
        <p class="brand-title">選択式ゲームブック / 診断コンテンツ</p>
      </div>
      <div class="actions">
        <button id="backButton" class="btn btn-secondary" type="button">戻る</button>
        <button id="restartButton" class="btn btn-primary" type="button">最初から読む</button>
      </div>
    </header>

    <main id="app"></main>

    <p class="footer-note">このHTMLは1ファイルで配布できます。ブラウザでそのまま開いてご利用ください。</p>
  </div>

  <script>
    const nodes = {
      start: {
        type: "scene",
        title: "あなたの集客は、どこで止まっている？",
        subtitle: "選んで進む『AI×SNS×LINE導線』診断ゲームブック",
        text: [
          "あなたは今日もSNSを更新しました。投稿はしている。商品もある。発信も止めていない。",
          "それなのに、思うように申込みが入らない。",
          "『私、何を見直せばいいんだろう……』",
          "そんなとき、目の前に4つの扉が現れました。あなたが最初に開ける扉はどれですか？"
        ],
        choices: [
          { label: "投稿内容を見直す", next: "2" },
          { label: "商品そのものを見直す", next: "3" },
          { label: "LINE公式アカウントを見直す", next: "4" },
          { label: "セールスの流れを見直す", next: "5" }
        ]
      },
      "2": {
        type: "scene",
        title: "投稿内容を見直す",
        text: [
          "あなたはSNS投稿を見返しました。頻度は悪くありません。",
          "けれど、読み返してみると『何をしている人なのか』『誰のどんな悩みを解決するのか』が少し伝わりにくい気がします。",
          "このとき、あなたは何を優先しますか？"
        ],
        choices: [
          { label: "とにかく投稿数を増やす", next: "6" },
          { label: "誰に向けた発信かを明確にする", next: "7" }
        ]
      },
      "3": {
        type: "scene",
        title: "商品そのものを見直す",
        text: [
          "あなたは商品を見直しました。内容には自信があります。",
          "でも、ふとこんな疑問が浮かびました。『この商品、相手が今すぐ欲しいものとして見えているかな？』",
          "このとき、あなたはどちらを考えますか？"
        ],
        choices: [
          { label: "商品の内容をもっと増やす", next: "8" },
          { label: "相手が欲しい“結果”で見せ直す", next: "9" }
        ]
      },
      "4": {
        type: "scene",
        title: "LINE公式アカウントを見直す",
        text: [
          "あなたはLINE公式アカウントを開きました。登録者はいる。けれど、登録後の流れが整っていません。",
          "あいさつメッセージ、導線、配信内容、リッチメニュー。どれも何となく作ったままです。",
          "最初に着手するならどちらですか？"
        ],
        choices: [
          { label: "見た目を整える", next: "10" },
          { label: "登録後の導線設計を整える", next: "11" }
        ]
      },
      "5": {
        type: "scene",
        title: "セールスの流れを見直す",
        text: [
          "あなたはセールスの流れを思い返しました。発信はしている。LINEにも来てもらっている。",
          "でも、案内を出すと反応が薄い。売り込みたくない気持ちも強く、遠慮してしまいます。",
          "あなたはどうしますか？"
        ],
        choices: [
          { label: "案内頻度を減らす", next: "12" },
          { label: "信頼構築の流れを先に作る", next: "13" }
        ]
      },
      "6": {
        type: "result",
        resultKey: "A",
        bridge: [
          "投稿数を増やしました。でも、反応は少し増えただけ。疲れるわりに、申込みにはつながりません。",
          "ここで気づきます。量の前に、設計が必要だったのかもしれない。"
        ]
      },
      "7": {
        type: "scene",
        title: "誰に向けた発信かを明確にする",
        text: [
          "あなたは『誰に向けた発信か』を明確にしました。すると、投稿内容が変わりました。",
          "言葉が具体的になり、相手の悩みに触れられるようになります。少しずつ『私のことみたいです』と言われるようになりました。",
          "ですが、まだ申込みは安定しません。次に見るべき場所はどこでしょう？"
        ],
        choices: [
          { label: "商品設計", next: "3" },
          { label: "LINE導線", next: "4" }
        ]
      },
      "8": {
        type: "result",
        resultKey: "B",
        bridge: [
          "商品の内容を増やしました。特典も足しました。資料も増やしました。",
          "でも、不思議なことに、相手の反応はそこまで変わりません。",
          "ここで気づきます。お客様が買いたいのは、情報量ではなく、“それを手に入れた先の未来”なのかもしれません。"
        ]
      },
      "9": {
        type: "scene",
        title: "相手が欲しい結果で見せ直す",
        text: [
          "あなたは商品の見せ方を変えました。『何を教えるか』ではなく、『受けたらどう変わるか』を伝えるようにしました。",
          "すると、興味を持つ人は増えました。けれど、そこから申込みに進む人はまだ少なめです。",
          "次に見直すべきはどこですか？"
        ],
        choices: [
          { label: "LINE導線", next: "4" },
          { label: "セールスの流れ", next: "5" }
        ]
      },
      "10": {
        type: "result",
        resultKey: "C",
        bridge: [
          "LINEの見た目を整えました。アイコン、あいさつ文、リッチメニュー。前より印象は良くなりました。",
          "ですが、登録後に何を読んで、何を感じて、どこへ進むのか。その流れが曖昧なままなので、成果は限定的です。",
          "ここで気づきます。見た目は大切。でも、導線はもっと大切。"
        ]
      },
      "11": {
        type: "scene",
        title: "登録後の導線設計を整える",
        text: [
          "あなたは登録後の流れを見直しました。最初に何を伝え、どんな順番で信頼を作り、どこで行動を促すかを設計しました。",
          "すると、ただ登録者数を増やすよりも、“申込みにつながる導線”が大事だったことが見えてきました。",
          "さらに結果を伸ばすため、次に見直すなら？"
        ],
        choices: [
          { label: "投稿のメッセージ設計", next: "2" },
          { label: "セールスの流れ", next: "5" }
        ]
      },
      "12": {
        type: "result",
        resultKey: "D",
        bridge: [
          "案内頻度を減らしました。たしかに気は楽になりました。",
          "でも、申込みはもっと減ってしまいました。",
          "ここで気づきます。売れない原因は、案内の回数ではなく、案内する前の信頼構築不足かもしれません。"
        ]
      },
      "13": {
        type: "result",
        resultKey: "E",
        bridge: [
          "あなたは、すぐに売るのではなく、まず相手に『この人の話、もっと聞きたい』と思ってもらう流れを作りました。",
          "価値観、考え方、事例、気づき、世界観。それらを順番に伝えることで、相手の反応が変わってきました。",
          "そして、案内を出しても、前より自然に受け取ってもらえるようになりました。"
        ]
      }
    };

    const results = {
      A: {
        name: "発信量頼みタイプ",
        lead: "あなたは頑張っています。でも、今必要なのは努力量を増やすことではなく、誰に、何を、どんな順番で届けるかの設計です。",
        issues: [
          "投稿しているのに刺さらない",
          "反応はあるが申込みにつながらない",
          "発信が感覚的になっている"
        ],
        actions: [
          "ターゲットを明確にする",
          "悩みベースで発信を組み立てる",
          "SNSからLINEへの流れを作る"
        ]
      },
      B: {
        name: "商品説明過多タイプ",
        lead: "商品内容を充実させることは大切です。ですが、お客様が知りたいのは『何が入っているか』以上に、『受けたらどう変われるか』です。",
        issues: [
          "内容は良いのに魅力が伝わりにくい",
          "機能説明が多くなりやすい",
          "ベネフィットより詳細説明が先に来ている"
        ],
        actions: [
          "商品を『変化』で伝える",
          "お客様の未来を言語化する",
          "理想の状態を具体的に描写する"
        ]
      },
      C: {
        name: "LINE未設計タイプ",
        lead: "LINE公式アカウントは持っていても、登録後の導線が整っていなければ、名簿が増えるだけで終わります。大事なのは、登録後に信頼が積み上がる流れです。",
        issues: [
          "あいさつ文や配信が単発で終わっている",
          "何を送ればいいかわからない",
          "申込みへの道筋が曖昧"
        ],
        actions: [
          "登録直後の教育導線を作る",
          "信頼構築の配信シリーズを設計する",
          "リッチメニューとオファー動線をつなげる"
        ]
      },
      D: {
        name: "売り込み恐怖タイプ",
        lead: "売り込みたくない気持ちは、とても自然です。ですが、本当に必要なのは、売らないことではなく、売る前に信頼を作ることです。",
        issues: [
          "案内に遠慮が出る",
          "セールスに苦手意識がある",
          "必要な人に情報が届いていない"
        ],
        actions: [
          "教育と信頼構築を先に入れる",
          "売り込みではなく提案の形にする",
          "お客様が判断しやすい導線を作る"
        ]
      },
      E: {
        name: "仕組み化直前タイプ",
        lead: "ここまで来ているなら、あと一歩です。発信、導線、信頼構築の感覚が育ってきています。次に必要なのは、再現性のある形に整えることです。",
        issues: [
          "単発では動くが、安定しない",
          "感覚でできるが言語化できていない",
          "毎回ゼロから考えている"
        ],
        actions: [
          "SNS→LINE→案内の流れを型にする",
          "配信テンプレートを持つ",
          "申込みまでの導線を見える化する"
        ]
      }
    };

    const cta = {
      title: "次の一歩",
      text: "今日このゲームブックを進めてみて『私の集客、頑張り方は間違っていなかったけれど、順番が違ったのかもしれない』と感じたなら、それは大きな一歩です。必要なのは、発信・商品・LINE・信頼構築をバラバラに考えることではなく、1本の導線としてつなげることです。",
      suggestions: [
        "LINEでタイプ別の改善ヒントを受け取る",
        "自分の導線を見直すチェックリストを使う",
        "AI×SNS×LINEの導線設計ワークショップに参加する"
      ],
      lineButtonLabel: "LINEで無料診断を受け取る",
      lineSubtext: "友だち追加後に、タイプ別の改善ヒントと導線見直しのポイントを受け取れます。",
      lineNote: "そのまま配布できる単体HTML版です。必要に応じて文言や特典内容も編集できます。",
      lineUrl: "https://lin.ee/yNIsfgg"
    };

    const app = document.getElementById("app");
    const backButton = document.getElementById("backButton");
    const restartButton = document.getElementById("restartButton");

    let currentId = "start";
    let history = ["start"];

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function goTo(nextId) {
      currentId = nextId;
      history.push(nextId);
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function goBack() {
      if (history.length <= 1) return;
      history.pop();
      currentId = history[history.length - 1];
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function restart() {
      currentId = "start";
      history = ["start"];
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderScene(node) {
      return `
        <section class="hero">
          <p class="eyebrow">AKIKO BRAND STORY</p>
          <h1>${escapeHtml(node.title)}</h1>
          ${node.subtitle ? `<p class="subtitle">${escapeHtml(node.subtitle)}</p>` : ""}
        </section>

        <section class="card">
          ${node.text.map((paragraph) => `<p>${escapeHtml(paragraph)}</p>`).join("")}
        </section>

        <section class="choices">
          ${node.choices.map((choice, index) => `
            <button class="btn choice-button" type="button" data-next="${escapeHtml(choice.next)}" aria-label="${escapeHtml(choice.label)} を選ぶ">
              <span class="choice-label">${escapeHtml(choice.label)}</span>
              <span class="choice-tag">選ぶ</span>
            </button>
          `).join("")}
        </section>
      `;
    }

    function renderResult(node) {
      const result = results[node.resultKey];
      return `
        <section class="result-shell">
          <div class="result-head">
            <p class="eyebrow">DIAGNOSIS RESULT</p>
            <h1>${escapeHtml(result.name)}</h1>
            <p class="lead">${escapeHtml(result.lead)}</p>
          </div>
        </section>

        <section class="card result-bridge">
          ${node.bridge.map((paragraph) => `<p>${escapeHtml(paragraph)}</p>`).join("")}
        </section>

        <section class="result-grid">
          <article class="stat-card rose">
            <h2>今の課題</h2>
            <ul class="point-list">
              ${result.issues.map((item) => `
                <li>
                  <span class="dot rose"></span>
                  <span>${escapeHtml(item)}</span>
                </li>
              `).join("")}
            </ul>
          </article>

          <article class="stat-card emerald">
            <h2>改善ポイント</h2>
            <ul class="point-list">
              ${result.actions.map((item) => `
                <li>
                  <span class="dot emerald"></span>
                  <span>${escapeHtml(item)}</span>
                </li>
              `).join("")}
            </ul>
          </article>
        </section>

        <section class="cta-wrap">
          <div class="cta-inner">
            <h2>${escapeHtml(cta.title)}</h2>
            <p class="cta-text">${escapeHtml(cta.text)}</p>

            <div class="suggestion-grid">
              ${cta.suggestions.map((item) => `<div class="suggestion">${escapeHtml(item)}</div>`).join("")}
            </div>

            <div class="line-cta">
              <div>
                <p class="line-label">LINE CTA</p>
                <p class="line-copy">${escapeHtml(cta.lineSubtext)}</p>
                <p class="note">${escapeHtml(cta.lineNote)}</p>
              </div>
              <a class="btn line-button" href="${escapeHtml(cta.lineUrl)}" target="_blank" rel="noreferrer">${escapeHtml(cta.lineButtonLabel)}</a>
            </div>
          </div>
        </section>
      `;
    }

    function bindChoiceEvents() {
      document.querySelectorAll("[data-next]").forEach((button) => {
        button.addEventListener("click", () => {
          const nextId = button.getAttribute("data-next");
          if (nextId && nodes[nextId]) {
            goTo(nextId);
          }
        });
      });
    }

    function updateButtons() {
      backButton.disabled = history.length <= 1;
    }

    function render() {
      const node = nodes[currentId];
      app.innerHTML = node.type === "scene" ? renderScene(node) : renderResult(node);
      bindChoiceEvents();
      updateButtons();
    }

    backButton.addEventListener("click", goBack);
    restartButton.addEventListener("click", restart);

    render();
  </script>
</body>
</html>
